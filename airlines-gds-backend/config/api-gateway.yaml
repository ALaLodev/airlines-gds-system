server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  # Configuración de conexión a Redis (el que tienes en Docker)
  redis:
    host: localhost
    port: 6379

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200" # Damos permisos a Angular
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Tráfico hacia el AUTH-SERVICE
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # RUTA PARA VUELOS:
        - id: flight-service
          uri: lb://FLIGHT-SERVICE
          predicates:
            - Path=/api/flights/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: flightCircuitBreaker
                fallbackUri: forward:/fallback/flights

        # RUTA PARA RESERVAS:
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**
          filters:
            - AuthenticationFilter
            # Circuit Breaker
            - name: CircuitBreaker
              args:
                name: bookingCircuitBreaker
                fallbackUri: forward:/fallback/booking
            # Control de Tráfico (Rate Limiting)
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10 # Cuántos "tokens" nuevos damos por segundo (1 por segundo)
                redis-rate-limiter.burstCapacity: 20 # Ráfaga máxima permitida de golpe (2 seguidas)
                #redis-rate-limiter.requestedTokens: 1 # Cuántos tokens cuesta cada petición (1)

        # RUTA PARA PAGOS:
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
          filters:
            - AuthenticationFilter

        # RUTA PARA INVENTARIO:
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/inventories/**
          filters:
            - AuthenticationFilter

        # RUTA PARA AGENCIES:
        - id: agency-service
          uri: lb://AGENCY-SERVICE
          predicates:
            - Path=/api/agencies/**
          filters:
            - AuthenticationFilter

# Configuración fina del Circuit Breaker (Tiempos de espera y fallos)
resilience4j:
  circuitbreaker:
    instances:
      bookingCircuitBreaker:
        slidingWindowSize: 10 # Evalúa las últimas 10 peticiones
        failureRateThreshold: 50 # Si el 50% falla, abre el circuito (bloquea el servicio)
        waitDurationInOpenState: 10000 # Espera 10 segundos antes de volver a probar si ya revivió

      flightCircuitBreaker:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5000 # Esperamos menos tiempo para recuperar vuelos
  timelimiter:
    instances:
      bookingCircuitBreaker:
        timeoutDuration: 3s # Si el booking tarda más de 3 segundos en responder, lo considera fallo
      flightCircuitBreaker:
        timeoutDuration: 2s # Un buscador debe responder rápido

jwt:
  secret: "TuClaveSecretaSuperLargaParaFirmarLosTokensGDS2026"

management:
  # 1. Configuración de Prometheus (Métricas)
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true

  # 2. Configuración de Zipkin (Trazabilidad)
  tracing:
    sampling:
      probability: 1.0 # Significa que traza el 100% de las peticiones
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans