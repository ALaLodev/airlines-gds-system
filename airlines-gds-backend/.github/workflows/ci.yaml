name: Airlines GDS CI

"on":
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Verify Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar Microservicios
        run: |
          echo "Buscando archivos pom.xml en el proyecto..."
          find . -name "pom.xml" -not -path "*/target/*" -not -path "*/.git/*" -execdir mvn clean package -DskipTests \;